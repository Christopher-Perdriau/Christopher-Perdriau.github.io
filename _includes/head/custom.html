<!--
  Enlarges the sidebar profile photo. The theme's default caps it at
  110px on wide screens and squeezes it into a 36px inline avatar on
  narrow/mobile screens; both are overridden here to make the photo
  the visual anchor of the sidebar it's meant to be.

  border-radius: 50% is applied by the theme directly to the <img>,
  so width/height must be forced equal (with object-fit: cover) or
  a non-square rendered box turns the circle into an oval.
-->
<style>
  .author__avatar {
    width: 150px !important;
    height: 150px !important;
  }
  .author__avatar img {
    width: 150px !important;
    height: 150px !important;
    max-width: 150px !important;
    object-fit: cover !important;
  }
  @media screen and (min-width: 925px) {
    .author__avatar {
      width: 225px !important;
      height: 225px !important;
    }
    .author__avatar img {
      width: 225px !important;
      height: 225px !important;
      max-width: 225px !important;
    }
  }
</style>
